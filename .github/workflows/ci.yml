name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chrono24-chatbot .

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('app/config.py') }}
          restore-keys: |
            hf-models-
      - run: pip install -r requirements-dev.txt
      # Index wird nicht mehr committet (siehe README, "Pipeline neu bauen") --
      # ohne API-Kosten, Embedding laeuft lokal.
      - run: python -m pipeline.index
      - run: python -m eval.run_eval --gate

  quality-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Voller Verlauf, damit der Diff unten auch groessere Pushes aufloest.
          fetch-depth: 0
      # Der Judge kostet ~66 Haiku-Calls pro Lauf. Ein Push, der nur Markdown
      # oder docs/ anfasst, kann die Antwortqualitaet nicht veraendern -- dann
      # wird der Lauf uebersprungen. Im Zweifel laeuft er: laesst sich der
      # Commit-Bereich nicht aufloesen (erster Push, Force-Push), wird lieber
      # einmal zu viel gemessen als eine Regression verpasst.
      - id: scope
        run: |
          before='${{ github.event.before }}'
          zero='0000000000000000000000000000000000000000'
          if [ -z "$before" ] || [ "$before" = "$zero" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "Commit-Bereich nicht aufloesbar -- Judge laeuft."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" '${{ github.sha }}' | grep -qvE '(^|/)[^/]*\.md$|^docs/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nur Dokumentation geaendert -- Judge-Lauf uebersprungen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        if: steps.scope.outputs.run == 'true'
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('app/config.py') }}
          restore-keys: |
            hf-models-
      - if: steps.scope.outputs.run == 'true'
        run: pip install -r requirements-dev.txt
      # Index wird nicht mehr committet -- ohne API-Kosten, Embedding laeuft lokal.
      - if: steps.scope.outputs.run == 'true'
        run: python -m pipeline.index
      - if: steps.scope.outputs.run == 'true'
        run: python -m eval.judge --gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
